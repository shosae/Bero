slam_toolbox:
  ros__parameters:

    # ==================== frames, LiDAR ====================
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    scan_topic: /scan

    # -------------------------
    #  General
    # -------------------------
    resolution: 0.05          # occupancy map cell 한 변의 길이(m)
    min_laser_range: 0.15     # LiDAR 최소 사용 거리(m)
    max_laser_range: 8.0      # LiDAR 최대 사용 거리(m)
    map_update_interval: 0.5  # occupancy map 발행 주기(s)
    occupancy_threshold: 0.2  # occupancy map cell 내 scan의 hit/pass 비율이 이 값 이상이면 장애물로 간주
    min_pass_through: 2       # occupancy map cell 점유 판단 전 필요한 최소 scan pass 횟수

    minimum_time_interval: 0.2    # scan 처리 최소 간격(s)
    minimum_travel_distance: 0.1  # 새 scan 처리에 필요한 최소 이동거리(m)
    minimum_travel_heading: 0.1   # 새 scan 처리에 필요한 최소 회전량(rad)
    
    do_loop_closing: true      # loop closure 활성화 여부
    use_scan_matching: true    # scan matching 활성화 여부
    use_scan_barycenter: true  # scan endpoint들의 중심점으로 scan 간 거리 계산

    # -------------------------
    #  Async Params
    # -------------------------

    # ==================== solver ====================
    solver_plugin: solver_plugins::CeresSolver   # 비선형 최적화 solver plugin
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY  # Ceres 선형 solver 종류
    ceres_preconditioner: SCHUR_JACOBI           # Ceres preconditioner 종류
    ceres_trust_strategy: LEVENBERG_MARQUARDT    # Ceres trust region 전략
    ceres_dogleg_type: TRADITIONAL_DOGLEG        # dogleg 사용 시 세부 전략
    ceres_loss_function: None                    # outlier 억제용 loss function

    # ==================== general ====================
    use_map_saver: true   # map saver 활성화
    throttle_scans: 1     # scan 처리 간격(1 = 모든 scan 처리, N = N개 중 1개 처리)
    debug_logging: false  # logger debug 출력 활성화
    stack_size_to_use: 40000000    # 큰 맵을 위한 stack 크기(bytes)
    enable_interactive_mode: true  # Rviz에서 편집 허용

    # ==================== tf ====================
    transform_timeout: 0.2          # TF timeout(s)
    tf_buffer_duration: 30.0        # TF buffer 보관 시간(s)
    transform_publish_period: 0.02  # map -> odom tf 발행 주기(s)

    # ==================== scan matching ====================
    scan_buffer_size: 20  # scan matching에 사용할 scan buffer의 최대 개수
    scan_buffer_maximum_scan_distance: 12.0  # scan matching buffer의 앞/뒤 scan 사이 최대 거리(m)
    coarse_search_angle_offset: 0.349  # coarse scan matching에서 탐색할 각도 범위(rad)
    coarse_angle_resolution: 0.0349    # coarse scan matching 각도 탐색 해상도(rad)
    fine_search_angle_offset: 0.00349  # fine scan matching에서 탐색할 각도 범위(rad)
    distance_variance_penalty: 0.5  # odom과의 위치 차이에 대한 scan matching 벌점
    angle_variance_penalty: 1.0     # odom과의 각도 차이에 대한 scan matching 벌점
    minimum_distance_penalty: 0.5   # 거리 벌점 하한
    minimum_angle_penalty: 0.9      # 각도 벌점 하한
    use_response_expansion: true    # 초기 탐색에서 좋은 매칭이 없으면 탐색 공간 확장

    # ==================== scan matching correlation ====================
    correlation_search_space_dimension: 0.5        # scan correlation 탐색 window 한 변의 길이(m)
    correlation_search_space_resolution: 0.01      # scan correlation 탐색 cell 해상도(m)
    correlation_search_space_smear_deviation: 0.1  # correlation 응답을 부드럽게 하는 smear 거리(m)

    # ==================== edge linking ====================
    link_scan_maximum_distance: 1.5        # edge를 추가할 scan 사이의 최대 거리(m)
    link_match_minimum_response_fine: 0.1  # edge를 추가할 최소 fine correlation 응답값

    # ==================== loop closure ====================
    loop_search_maximum_distance: 3.0  # 현재 위치에서 이 거리 이내 scan들을 loop closure 후보로 탐색
    loop_match_minimum_chain_size: 12  # loop closure 시도에 필요한 최소 scan chain 길이
    loop_match_maximum_variance_coarse: 3.0   # coarse loop closure 후보의 공분산 상한
    loop_match_minimum_response_coarse: 0.40  # fine 단계로 넘길 최소 coarse 응답값
    loop_match_minimum_response_fine: 0.50    # fine loop closure를 최종 승인할 최소 응답값

    # ==================== loop closure correlation ====================
    loop_search_space_dimension: 8.0    # loop closure용 탐색 window 한 변의 길이(m)
    loop_search_space_resolution: 0.05  # loop closure용 탐색 cell 해상도(m)
    loop_search_space_smear_deviation: 0.03  # loop closure용 correlation smear 거리(m)
