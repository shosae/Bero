# ==================== Costmap ====================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      transform_tolerance: 0.3
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0   # costmap 갱신 주기(Hz)
      publish_frequency: 2.0  # 시각화 발행 주기(Hz)
      rolling_window: true    # rolling window 사용 여부
      width: 5   # local costmap window의 가로 길이(m)
      height: 5  # local costmap window의 세로 길이(m)
      resolution: 0.05    # occupancy grid cell 한 변의 길이(m)
      robot_radius: 0.16  # 원형 robot footprint 반지름
      footprint: "[]"  # 다각형 robot footprint
      footprint_padding: 0.01     # 로봇 주위 padding(m)
      always_send_full_costmap: true  # costmap 전체 발행 여부
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        footprint_clearing_enabled: true  # footprint 밑에 장애물이 있으면 clear
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          inf_is_valid: false  # scan의 inf값을 유효한 값으로 볼지
          clearing: true  # 빈 공간 clearing 여부
          marking: true   # 장애물 marking 여부
          data_type: "LaserScan"
          raytrace_max_range: 4.0  # 빈 공간 clearing을 적용할 최대 거리(m)
          raytrace_min_range: 0.0  # 빈 공간 clearing을 시작할 최소 거리(m)
          obstacle_max_range: 2.5  # 장애물로 marking할 최대 거리(m)
          obstacle_min_range: 0.0  # 장애물로 marking할 최소 거리(m)
          observation_persistence: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0  # inflation cost 감소 계수
        inflation_radius: 0.4     # inflation 범위(m)

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      transform_tolerance: 0.3
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 5.0   # costmap 갱신 주기(Hz)
      publish_frequency: 2.0  # 시각화 발행 주기(Hz)
      resolution: 0.05    # occupancy grid cell 한 변의 길이(m)
      robot_radius: 0.16  # 원형 robot footprint 반지름
      footprint: "[]"  # 다각형 robot footprint
      footprint_padding: 0.01     # 로봇 주위 padding(m)
      track_unknown_space: true  # unknown 셀 기본값을 NO_INFORMATION(255)로 유지(false: FREE_SPACE(0))
      always_send_full_costmap: true  # costmap 전체 발행 여부
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        footprint_clearing_enabled: true  # footprint 밑에 장애물이 있으면 clear
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          inf_is_valid: false  # scan의 inf값을 유효한 값으로 볼지
          clearing: true  # 빈 공간 clearing 여부
          marking: true   # 장애물 marking 여부
          data_type: "LaserScan"
          raytrace_max_range: 5.0  # 빈 공간 clearing을 적용할 최대 거리(m)
          raytrace_min_range: 0.0  # 빈 공간 clearing을 시작할 최소 거리(m)
          obstacle_max_range: 4.0  # 장애물로 marking할 최대 거리(m)
          obstacle_min_range: 0.0  # 장애물로 marking할 최소 거리(m)
          observation_persistence: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0  # inflation cost 감소 계수
        inflation_radius: 0.4     # inflation 범위(m)

# ==================== Map ====================
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""  # initial map 경로

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

# ==================== Global Planner ====================
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.4  # 도착 지점 cell이 막혔을 때 찾을 대체 도달점 범위(m)
      use_astar: true  # A* 사용여부(false: Dijkstra)
      allow_unknown: false   # unknown 셀을 장애물로 취급하여 경로 탐색에서 제외

# ==================== Global Plan Smoother ====================
# BT XML에 SmoothPath 노드를 추가해서 사용
# smoother_server:
#   ros__parameters:
#     use_sim_time: false
#     smoother_plugins: ["simple_smoother"]
#     simple_smoother:
#       plugin: "nav2_smoother::SimpleSmoother"
#       tolerance: 1.0e-10
#       max_its: 1000
#       do_refinement: true

# ==================== Behavior Server ====================
behavior_server:
  ros__parameters:
    use_sim_time: false
    transform_tolerance: 0.1
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    global_frame: odom
    robot_base_frame: base_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# ==================== Waypoint Follower ====================
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

# ==================== Velocity Smoother ====================
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    feedback: "OPEN_LOOP"
    odom_topic: "/odometry/filtered"  # CLOSED_LOOP 전용
    odom_duration: 0.1  # CLOSED_LOOP 전용
    smoothing_frequency: 20.0  # 출력 속도 계산 빈도
    velocity_timeout: 1.0   # 마지막 속도 명령 이후 정지 명령으로 전환하는 timeout(s)
    scale_velocities: true  # 한 축이 가감속 한계를 넘으면 전체 속도 변화 비율 축소

    # [vx, vy, wz]
    max_velocity: [0.44, 0.38, 2.81]     # 최대 속도
    min_velocity: [-0.44, -0.38, -2.81]  # 최소 속도
    max_accel: [0.4, 0.4, 2.0]     # 가속도 제한
    max_decel: [-0.4, -0.4, -2.5]  # 감속도 제한
    deadband_velocity: [0.048, 0.042, 0.305]  # 최소 유효 속도
