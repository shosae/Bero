# ==================== Local Planner ====================
controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /odometry/filtered
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001  # x축 속도를 0으로 간주하는 임계값
    min_y_velocity_threshold: 0.001  # y축 속도를 0으로 간주하는 임계값
    min_theta_velocity_threshold: 0.001  # 각속도를 0으로 간주하는 임계값
    failure_tolerance: 0.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 20.0

    # Goal checker
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # ==================== MPPI ====================
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      transform_tolerance: 0.1
      visualize: false      # MPPI traj 시각화 여부
      motion_model: "Omni"  # motion model
      iteration_count: 1  # 최적화 반복 횟수
      temperature: 0.3  # 낮을수록 최적의 궤적 1개에 집중, 높으면 여러 궤적의 평균
      batch_size: 1500  # 샘플링 궤적 개수
      time_steps: 56  # 시뮬레이션 예측 스텝 수
      model_dt: 0.05  # 스텝 간격(초)
      vx_std: 0.2   # vx 제어 샘플링 표준편차
      vy_std: 0.2  # vy 제어 샘플링 표준편차
      wz_std: 0.4   # wz 제어 샘플링 표준편차
      vx_max: 0.44  # 최대 전진 속도(m/s)
      vx_min: -0.44 # 최대 후진 속도(m/s)
      vy_max: 0.38  # 최대 횡방향 속도(m/s)
      wz_max: 2.81  # 최대 회전 속도(rad/s)
      gamma: 0.015  # 제어 명령 패널티 가중치(높으면 매끈하고 보수적으로, 낮으면 날카롭게)

      # 시각화
      TrajectoryVisualizer:
        trajectory_step: 10   # 시각화 궤적 간격
        time_step: 5         # 포인트 간격

      # 평가 기준, 최종 비용 = (critic별 측정값 x cost_weight) ^ cost_power
      critics: [
        "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
        "GoalCritic", "GoalAngleCritic",
        "TwirlingCritic", "VelocityDeadbandCritic", "ObstaclesCritic", "ConstraintCritic"
      ]
      # unused critics: "CostCritic", "PreferForwardCritic"

      # -------- path critics --------
      # offset_from_furthest는 global path point index 기준
      # point 계산은 global costmap의 resolution을 따라감
      # resolution = 포인트 간 거리, resolution = 0.05 -> 20 points = 1m

      # 경로 정렬 이탈 평가
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0           # 경로 정렬 오차 패널티
        offset_from_furthest: 20    # 경로를 이 point 수 이상 따라간 뒤 평가 활성화
        threshold_to_consider: 0.5  # 평가 종료 반경(goal 근처에서는 goal critic으로 평가)
        max_path_occupancy_ratio: 0.05  # 전역 경로가 막힌 비율이 이 값보다 크면 PathAlignCritic 비활성화
        trajectory_point_step: 4      # 전체 time_steps 중 4칸씩 건너뛰며 궤적 평가
        use_path_orientations: false  # 경로와 각도까지 맞출지 여부 (false면 횡이동 가능)

      # 경로 추종 오차 평가
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0            # 경로 추종 오차 패널티
        offset_from_furthest: 5     # 경로 추종에 사용할 목표 경로 point offset
        threshold_to_consider: 1.4  # 평가 종료 반경(goal 근처에서는 goal critic으로 평가)

      # 경로 방향 오차 평가
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0            # 경로 방향 오차 패널티
        offset_from_furthest: 4     # 각도 정렬에 사용할 목표 경로 point offset
        threshold_to_consider: 0.5  # 평가 종료 반경(goal 근처에서는 goal critic으로 평가)
        max_angle_to_furthest: 1.0  # 목표점과의 각도가 이 값 이상일 때 critic 활성화(rad)
        forward_preference: false   # true: 전진 주행 선호, false: 후진 주행도 허용

      # -------- goal critics --------
      # 목표 위치 오차 평가
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0            # 목표점에서 멀수록 패널티
        threshold_to_consider: 1.4  # 목표점 1.4m 이내부터 평가

      # 목표 각도 오차 평가
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0            # 목표 각도와 다를수록 패널티
        threshold_to_consider: 1.0  # 목표점 1.0m 이내부터 각도 평가

      # -------- other critics --------
      # 불필요한 회전 평가
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0  # 불필요한 회전에 패널티

      # Deadband 이하 속도 명령 평가
      VelocityDeadbandCritic: 
        enabled: true
        cost_power: 1
        cost_weight: 35.0  # Deadband 명령 패널티
        deadband_velocities: [0.048, 0.042, 0.305]  # 최소 유효 속도

      # 장애물 근접 평가
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5      # 장애물 근처 접근 패널티
        critical_weight: 20.0      # 충돌 임박 영역 패널티
        collision_margin_distance: 0.1  # 장애물과 최소 이격 거리(m)
        inflation_radius: 0.4      # local costmap의 inflation_radius와 동일값(m)
        cost_scaling_factor: 5.0   # local costmap의 cost_scaling_factor와 동일값
        consider_footprint: false  # false: robot_radius, true: footprint 기반 검사
        collision_cost: 10000.0    # 충돌 패널티
        near_goal_distance: 0.5    # 목표 근처에서는 장애물 회피 완화(m)

      # 속도 및 기구학 제약 위반 평가
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0  # 속도 및 기구학 위반 궤적 평가

      # -------- unused critics --------
      # Costmap 비용 평가
      # CostCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 3.81           # 높은 cost 영역일수록 패널티
      #   critical_cost: 300.0        # INSCRIBED_INFLATED_OBSTACLE 이상일 때 더하는 패널티 값
      #   consider_footprint: false   # false: robot_radius, true: footprint 기반 검사
      #   collision_cost: 10000.0   # 실제 충돌 패널티
      #   near_goal_distance: 0.5     # 목표 근처 costmap 회피 패널티 완화(m)

      # 전진 주행 선호 평가
      # PreferForwardCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 2.0            # 후진/역방향 이동 억제
      #   threshold_to_consider: 0.5  # 평가 종료 반경(goal 근처에서는 goal critic으로 평가)

    # ==================== DWB ====================
    # FollowPath:
    #   plugin: "dwb_core::DWBLocalPlanner"
    #   transform_tolerance: 0.1
    #   sim_time: 1.3
    #   vx_samples: 17
    #   vy_samples: 8
    #   vtheta_samples: 20
    #   linear_granularity: 0.05
    #   angular_granularity: 0.025
    #   min_vel_x: -0.44
    #   min_vel_y: -0.38
    #   max_vel_x: 0.44
    #   max_vel_y: 0.38
    #   max_vel_theta: 2.81
    #   min_speed_xy: 0.064
    #   max_speed_xy: 0.44
    #   min_speed_theta: 0.305
    #   acc_lim_x: 0.4
    #   acc_lim_y: 0.4
    #   acc_lim_theta: 2.0
    #   decel_lim_x: -0.4
    #   decel_lim_y: -0.4
    #   decel_lim_theta: -2.5
    #   xy_goal_tolerance: 0.25
