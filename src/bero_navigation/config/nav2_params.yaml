# ==================== AMCL ===================
amcl:
  ros__parameters:
    use_sim_time: false
    tf_broadcast: true
    transform_tolerance: 1.0
    scan_topic: scan
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    robot_model_type: "nav2_amcl::OmniMotionModel"  # motion model
    save_pose_rate: 0.5    # 마지막 amcl pose 저장 빈도
    laser_max_range: 25.0  # LiDAR 최대 거리
    laser_min_range: 0.1   # LiDAR 최소 거리
    update_min_a: 0.1      # 이 각도만큼 회전 시 업데이트(rad)
    update_min_d: 0.18     # 이 거리만큼 이동 시 업데이트(m)
    resample_interval: 1   # resampling 주기 (1이면 매번, N이면 N회마다 1회 수행)
    recovery_alpha_fast: 0.0  # 위치 추정 이탈 복구 파라미터
    recovery_alpha_slow: 0.0  # 위치 추정 이탈 복구 파라미터

    # -------- odometry motion model 노이즈 계수 --------
    alpha1: 0.2  # 회전으로 인한 odom 회전값 오차
    alpha2: 0.2  # 직진으로 인한 odom 회전값 오차
    alpha3: 0.2  # 직진으로 인한 odom 이동거리 오차
    alpha4: 0.2  # 회전으로 인한 odom 이동거리 오차
    alpha5: 0.2  # omni 전용 odom 횡방향 이동거리 오차

    # -------- 파티클 개수 조절 관련 --------
    # KLD-sampling: 위치 확률분포의 근사 오차를 기준으로 파티클 수를 자동 조절하는 기법
    pf_err: 0.05  # KLD-sampling의 허용 근사 오차, 로봇 위치 사후확률분포를 파티클 분포로 근사할 때의 KLD 오차 한계
    pf_z: 0.99    # pf_err 오차 한계를 만족시킬 신뢰도 계수
    min_particles: 500   # 최소 파티클 개수
    max_particles: 2000  # 최대 파티클 개수

    # -------- laser model(공통) --------
    laser_model_type: "likelihood_field"
    max_beams: 120  # 계산에 사용할 최대 beam 수
    sigma_hit: 0.2  # laser hit 위치 오차 표준편차
    z_hit: 0.5   # 맵과 맞는 측정값에 점수를 주는 가중치
    z_rand: 0.5  # 맵과 맞지 않는 측정값도 일부 허용하는 가중치

    # -------- laser model(likelihood_field, likelihood_field_prob model) --------    
    laser_likelihood_max_dist: 2.0  # 이 범위 이상은 다 같은 점수로 취급

    # -------- laser model(likelihood_field_prob model) --------
    do_beamskip: false  # likelihood_field_prob 모델에서 beam skip 사용 여부
    beam_skip_distance: 0.5   # beam이 map과 일치했다고 볼 최대 거리(m)
    beam_skip_threshold: 0.3  # beam 사용 판정을 위한 최소 일치 비율
    beam_skip_error_threshold: 0.9  # skip된 beam이 이 비율 이상이면 beam skip 해제

    # -------- laser model(beam model) --------
    z_max: 0.0    # 최대 거리 측정값에 점수를 주는 가중치
    z_short: 0.0  # 짧은 거리 측정값에 점수를 주는 가중치
    lambda_short: 0.1  # z_short 지수 감쇠 속도 계수

    # -------- initial pose --------
    set_initial_pose: true
    initial_pose:
      x: 4.631
      y: 3.740
      z: 0.0
      yaw: 0.002

